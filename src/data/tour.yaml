# date:     YYYY-MM-DD, YYYY-MM, or YYYY when the month isn't known yet
# kind:     talk | keynote | panel | workshop | stream | podcast
# country:  ISO 3166 alpha-2 code, or "online"
# city:     omit when unknown
# talk:     omit when the title isn't filled in yet
