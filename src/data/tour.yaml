# The tour log: every stage, panel, workshop, stream and podcast.
# Home, Events and every stat on the site are computed from this file.
#
# date:     YYYY-MM-DD, YYYY-MM, or YYYY when the month isn't known yet
# kind:     talk | keynote | panel | workshop | stream | podcast
# country:  ISO 3166 alpha-2 code, or "online"
# city:     omit when unknown
# talk:     omit when the title isn't filled in yet
# link:     event page; replay: recording URL
# photo:    file name in src/assets/events/
#
# Sources: elian.codes events, Sessionize, GitNation, FOSDEM, and the "Upcoming talks & events"
# list in the history of github.com/ElianCodes/ElianCodes (README). Elian confirmed all of them.
#
# Only list stages Elian spoke on. Events he only organized (React Africa, React Paris, BeJS...)
# live in organizedStages in src/data/site.ts.
#
# TODO (only Elian knows): replay URLs for AgentCon Singapore and React Brussels 2024.

# ---- 2026 ----
- id: cms-conf-2026
  date: 2026-11 # 12-14 Nov; the agenda doesn't say which day
  event: CMS Conf
  city: Gdynia
  country: PL
  kind: talk
  talk: "Astro as a Universal CMS Frontend: Patterns, Trade-Offs and a Real-World Case"
  abstract: How Astro's framework-agnostic rendering and islands unify headless, hybrid and visual-editor CMS setups, the trade-offs that matter in real projects, and lessons from integrating a visual CMS.
  link: https://cmsconf.com/speakers/elian-van-cutsem/
