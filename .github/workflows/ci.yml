name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Daily rebuild: "Next on stage" and the yearly stats are computed at build time,
  # so they go stale without a fresh build. Runs on the default branch.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vite+ checks
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build site
        run: pnpm build

      - name: Check internal links
        run: pnpm check:links

  deploy:
    name: Deploy to Cloudflare
    # Pushes, the daily schedule and manual runs on main deploy; pull requests just validate.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.elian.codes
    # Never cancel a deploy halfway; queue the next one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm exec astro build
        env:
          # Repository variable; set to "true" to load analytics in the production build.
          ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS }}

      - name: Deploy with Void
        run: pnpm exec void deploy --platform cloudflare --dir dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
